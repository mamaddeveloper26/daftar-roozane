name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "Android SDK: $ANDROID_HOME"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Prepare offline web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Enable Android notifications and exact alarms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
          ]
          for permission in permissions:
              if permission not in source:
                  source = source.replace("    <application", permission + "\n    <application", 1)
          path.write_text(source, encoding="utf-8")
          PY
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml

      - name: Install persistent signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Configure Gradle to use the persistent signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text(encoding="utf-8")
          signing = '''
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          '''
          if "storeFile file(System.getProperty(\"user.home\") + \"/.android/debug.keystore\")" not in source:
              source += "\n" + signing
          path.write_text(source, encoding="utf-8")
          PY
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|SHA-256'

      - name: Increase Android version code
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          path = "android/app/build.gradle"
          source = open(path, encoding="utf-8").read()
          updated, count = re.subn(r"versionCode\s+\d+", "versionCode " + os.environ["BUILD_NUMBER"], source, count=1)
          if count != 1:
              raise SystemExit("Could not find exactly one versionCode in android/app/build.gradle")
          open(path, "w", encoding="utf-8").write(updated)
          PY

      - name: Build signed update-compatible APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$APK"

      - name: Enforce permanent signing certificate
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          EXPECTED="e328f3d4ad67c506e2442986414c113b94e9d539d57dc8bdb53ab5d9b32b3dc2"
          echo "$CERTS" | grep -Fq "certificate SHA-256 digest: $EXPECTED" || {
            echo "::error::APK signing certificate changed. Refusing to publish an incompatible update."
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Roozane-APK-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
